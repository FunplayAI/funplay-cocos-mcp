name: Publish MCP Registry

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref containing the server.json version to publish
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    concurrency:
      group: publish-mcp-registry-${{ github.event.release.tag_name || inputs.release_ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_ref }}

      - name: Wait for npm package
        shell: bash
        run: |
          package_name="$(jq -r '.packages[] | select(.registryType == "npm") | .identifier' server.json)"
          package_version="$(jq -r '.packages[] | select(.registryType == "npm") | .version' server.json)"
          for attempt in {1..45}; do
            published_version="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
            if [[ "$published_version" = "$package_version" ]]; then
              echo "npm package is indexed: ${package_name}@${package_version}"
              exit 0
            fi

            echo "npm package is not indexed yet; retry $attempt/45"
            sleep 20
          done

          echo "npm package was not indexed in time: ${package_name}@${package_version}" >&2
          exit 1

      - name: Install MCP Publisher
        shell: bash
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" |
            tar xz mcp-publisher

      - name: Validate metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish metadata
        run: ./mcp-publisher publish server.json
